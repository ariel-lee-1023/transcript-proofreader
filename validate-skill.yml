name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Frontmatter and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Validate SKILL.md
        run: |
          python - <<'PY'
          import pathlib, re, sys
          import yaml

          errors = []
          root = pathlib.Path("skills")

          skills = sorted(root.glob("*/SKILL.md"))
          if not skills:
              sys.exit("No SKILL.md found under skills/")

          for skill in skills:
              rel = skill.as_posix()
              text = skill.read_text(encoding="utf-8")

              # --- frontmatter ---
              m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{rel}: missing YAML frontmatter delimited by ---")
                  continue

              try:
                  meta = yaml.safe_load(m.group(1)) or {}
              except yaml.YAMLError as exc:
                  errors.append(f"{rel}: frontmatter is not valid YAML ({exc})")
                  continue

              for key in ("name", "description"):
                  if not meta.get(key):
                      errors.append(f"{rel}: frontmatter is missing required key '{key}'")

              name = str(meta.get("name", ""))
              if name and not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name):
                  errors.append(f"{rel}: name '{name}' must be lowercase, hyphen-separated")
              if name and name != skill.parent.name:
                  errors.append(
                      f"{rel}: name '{name}' does not match directory '{skill.parent.name}'"
                  )

              desc = str(meta.get("description", ""))
              if len(desc) > 1024:
                  errors.append(f"{rel}: description is {len(desc)} chars (limit 1024)")
              if desc and len(desc) < 40:
                  errors.append(f"{rel}: description is too short to trigger reliably")

              # --- relative links resolve ---
              for target in re.findall(r"\]\(([^)#][^)]*)\)", text):
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  if not (skill.parent / target).exists():
                      errors.append(f"{rel}: broken relative link -> {target}")

              print(f"checked {rel} ({len(text.split())} words)")

          if errors:
              print("\nFAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print("\nAll skills valid.")
          PY

  package:
    name: Package release bundle
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Zip skill directory
        run: |
          cd skills
          zip -r ../transcript-proofreader.zip transcript-proofreader

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: transcript-proofreader.zip
